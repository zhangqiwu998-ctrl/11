name: Build full isolated HLS portfolio
on:
  push:
    branches: [hls-playback-test]
    paths: [".github/workflows/full-hls-portfolio.yml", "hls-full/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Build all 13 adaptive streams
        run: python3 hls-full/build.py
      - name: Assemble original-design preview
        run: |
          cp hls-full/index.html hls-site/index.html
          cp hls-preview/hls.min.js hls-site/hls.min.js
          cp hls-preview/hls.js-LICENSE hls-site/hls.js-LICENSE
          test "$(find hls-site/media -name master.m3u8 | wc -l)" -eq 13
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('hls-site/index.html','utf8');
          for (const m of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)) new Function(m[1]);
          JS
          cat hls-site/media/encoding-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Commit only the preview directory to experiment branch
        run: |
          test "$GITHUB_REF" = refs/heads/hls-playback-test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hls-site
          git commit -m "Build full 13-video adaptive streaming portfolio"
          git push origin HEAD:refs/heads/hls-playback-test
